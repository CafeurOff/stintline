# StintLine — stintline.omexis.fr, public replay-only site (ADR 0002, ADR 0027).
# Installed by vps-infra app-apply as sites-available/stintline-site; the certificate is issued
# (webroot) by app-apply once the DNS record points to the server. TLS policy, rate-limit zones
# and snippets come from vps-infra stack/nginx.
#
# Same routing as the demo image (infra/nginx/default.conf): nginx serves the built files of
# the release, everything else goes to the API (uvicorn 127.0.0.1:8020), which renders each
# page with its own head (ADR 0025), sitemap.xml and robots.txt. No /ws/: live is local only.
#
# Security headers: StintLine's own set (infra/nginx/security-headers.conf) plus HSTS, sent by
# nginx on every response, so the copies Django adds are hidden. The page CSP comes from the
# API. A location with its own add_header must repeat them (nginx drops inherited ones).

server {
    listen 80;
    listen [::]:80;
    server_name stintline.omexis.fr;

    include /etc/nginx/snippets/acme.conf;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stintline.omexis.fr;

    ssl_certificate /etc/letsencrypt/live/stintline.omexis.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stintline.omexis.fr/privkey.pem;

    # `vps maintenance on stintline` -> 503 page (ACME paths still served).
    set $app stintline;
    include /etc/nginx/snippets/maintenance.conf;

    root /opt/stintline/current/apps/web/dist;
    client_max_body_size 1M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    # Django's copies of the headers above: each is sent once, by nginx. Inherited by every
    # proxied location (none declares its own proxy_hide_header).
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Cross-Origin-Opener-Policy;

    # Text compresses 3-5x; images and fonts are compressed already.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json
               application/problem+json application/xml image/svg+xml text/plain;

    # Hashed file names: cached for a year. Repeats the headers (its own add_header).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        try_files $uri =404;
    }

    location /api/ {
        # Shared server-wide zone (vps-infra rate-limit-zones.conf): 15 r/s per address.
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://127.0.0.1:8020;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_read_timeout 60s;
    }

    location = /api/v1/health {
        proxy_pass http://127.0.0.1:8020;
        include /etc/nginx/snippets/proxy-params.conf;
        access_log off;
    }

    # Live snapshots (ADR 0011, 0030): one WebSocket per open live page, kept open while a
    # session runs. A few per address at most.
    location = /ws/live {
        limit_conn perip 4;
        proxy_pass http://127.0.0.1:8020;
        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/websocket.conf;
        proxy_send_timeout 1h;
    }

    location /ws/ {
        return 404;
    }

    # Prometheus scrapes 127.0.0.1:8020 directly (the API also refuses other addresses).
    location = /metrics {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri @page;
    }

    location @page {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://127.0.0.1:8020;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    access_log /var/log/nginx/stintline-access.log main;
    error_log /var/log/nginx/stintline-error.log;
}
