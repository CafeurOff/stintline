<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="StintLine: race strategy analysis for Formula 1 timing data. Unofficial project."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0f1012" />
    <title>StintLine</title>
    <script>
      // Apply the stored theme before first paint (dark is the default). Mirrors src/lib/theme.ts.
      // The sidebar state mirrors src/app/rail.ts.
      // Language: French pages live under /fr (src/lib/i18n/locale.ts). A reader whose stored
      // choice, else browser, is French and who lands on an English address goes to its /fr
      // twin before anything loads; crawlers have neither and stay on the English page.
      var french = /^\/fr(?=\/|$)/.test(location.pathname);
      document.documentElement.lang = french ? "fr" : "en";
      try {
        if (localStorage.getItem("stintline-theme") === "light") {
          document.documentElement.dataset.theme = "light";
        }
        if (localStorage.getItem("stintline-rail") === "collapsed") {
          document.documentElement.dataset.rail = "collapsed";
        }
        var stored = localStorage.getItem("stintline-locale");
        var prefers = stored ? stored === "fr" : /^fr/i.test(navigator.language);
        if (!french && prefers) {
          location.replace("/fr" + location.pathname + location.search + location.hash);
        }
      } catch {
        // Storage unavailable: keep the defaults.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
