<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="StintLine: race strategy analysis for Formula 1 timing data. Unofficial project."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0f1012" />
    <title>StintLine</title>
    <script>
      // Apply the stored theme before first paint (dark is the default). Mirrors src/lib/theme.ts.
      // Language mirrors src/lib/i18n/locale.ts (stored choice, else browser language).
      try {
        if (localStorage.getItem("stintline-theme") === "light") {
          document.documentElement.dataset.theme = "light";
        }
        var lang = localStorage.getItem("stintline-locale");
        document.documentElement.lang =
          lang === "fr" || lang === "en" ? lang : /^fr/i.test(navigator.language) ? "fr" : "en";
      } catch {
        // Storage unavailable: keep the defaults.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
