<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="StintLine: race strategy analysis for Formula 1 timing data. Unofficial project."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#1c1b19" />
    <title>StintLine</title>
    <script>
      // Apply the stored theme before first paint (dark is the default). Mirrors src/lib/theme.ts.
      try {
        if (localStorage.getItem("stintline-theme") === "light") {
          document.documentElement.dataset.theme = "light";
        }
      } catch {
        // Storage unavailable: keep the default theme.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
