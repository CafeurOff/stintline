      - fastest_lap_s
      - name
      - passes
      - pit_loss_reliable
      - pit_loss_s
      - red_flags
      - safety_cars
      - session_id
      - undercut_attempts
      - undercut_successes
      - virtual_safety_cars
      - wet
      - winner
      - winner_colour
      - winner_strategy
      - winner_team
      - year
    Compare:
      type: object
