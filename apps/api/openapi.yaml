components:
  schemas:
    Assumption:
      type: object
      properties:
        group:
          type: string
        name:
          type: string
        value:
          type: string
        description:
          type: string
      required:
      - description
      - group
      - name
      - value
    BrakingZone:
      type: object
      properties:
        start_m:
          type: integer
        end_m:
          type: integer
        entry_kph:
          type: integer
        min_kph:
          type: integer
          description: 'Lowest speed before full throttle: the apex'
        x:
          type: number
          format: double
        y:
          type: number
          format: double
      required:
      - end_m
      - entry_kph
      - min_kph
      - start_m
      - x
      - y
    CareerTotals:
      type: object
      properties:
        seasons:
          type: integer
        first_season:
          type: integer
          nullable: true
        last_season:
          type: integer
          nullable: true
        starts:
          type: integer
        wins:
          type: integer
        podiums:
          type: integer
        poles:
          type: integer
        fastest_laps:
          type: integer
          nullable: true
          description: Unknown (null) for careers starting before 2004
        points:
          type: number
          format: double
        championships:
          type: integer
        best_finish:
          type: integer
          nullable: true
      required:
      - best_finish
      - championships
      - fastest_laps
      - first_season
      - last_season
      - podiums
      - points
      - poles
      - seasons
      - starts
      - wins
    Championship:
      type: object
      properties:
        round:
          type: integer
        leader:
          $ref: '#/components/schemas/Driver'
        points:
          type: number
          format: double
        second:
          allOf:
          - $ref: '#/components/schemas/Driver'
          nullable: true
        lead:
          type: number
          format: double
          nullable: true
        leader_changed:
          type: boolean
      required:
      - lead
      - leader
      - leader_changed
      - points
      - round
      - second
    Circuit:
      type: object
      properties:
        ref:
          type: string
          description: Jolpica circuitId
          maxLength: 64
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 128
        locality:
          type: string
          maxLength: 128
        country:
          type: string
          maxLength: 64
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        wikipedia_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        outline:
          type: string
          nullable: true
          readOnly: true
          description: Small SVG path of the layout in a 100-unit box, from its newest
            timed race
      required:
      - country
      - locality
      - name
      - outline
      - ref
    CircuitProfile:
      type: object
      properties:
        circuit:
          $ref: '#/components/schemas/Circuit'
        races:
          type: integer
        latest_event_id:
          type: integer
        latest_session_id:
          type: integer
        lap_length_m:
          type: number
          format: double
          nullable: true
        top_speed_kph:
          type: number
          format: double
          nullable: true
        full_throttle_share:
          type: number
          format: double
          nullable: true
        braking_zones:
          type: integer
          nullable: true
        pit_loss_s:
          type: number
          format: double
          nullable: true
          description: Median over the races whose pit loss is reliable
        pit_loss_sigma_s:
          type: number
          format: double
          nullable: true
        degradation_s_per_lap:
          type: number
          format: double
          nullable: true
          description: Median over dry races of the mean dry-compound slope
        degradation:
          $ref: '#/components/schemas/DryCompoundSlopes'
        safety_car_races:
          type: integer
        vsc_races:
          type: integer
        wet_races:
          type: integer
        passes_per_race:
          type: number
          format: double
          nullable: true
        undercut_attempts:
          type: integer
        undercut_successes:
          type: integer
        winning_stops:
          type: array
          items:
            $ref: '#/components/schemas/WinningStops'
        fastest_lap_s:
          type: number
          format: double
          nullable: true
        fastest_lap_year:
          type: integer
          nullable: true
        history:
          type: array
          items:
            $ref: '#/components/schemas/CircuitRace'
      required:
      - braking_zones
      - circuit
      - degradation
      - degradation_s_per_lap
      - fastest_lap_s
      - fastest_lap_year
      - full_throttle_share
      - history
      - lap_length_m
      - latest_event_id
      - latest_session_id
      - passes_per_race
      - pit_loss_s
      - pit_loss_sigma_s
      - races
      - safety_car_races
      - top_speed_kph
      - undercut_attempts
      - undercut_successes
      - vsc_races
      - wet_races
      - winning_stops
    CircuitRace:
      type: object
      properties:
        year:
          type: integer
        event_id:
          type: integer
        session_id:
          type: integer
        name:
          type: string
        winner:
          allOf:
          - $ref: '#/components/schemas/Driver'
          nullable: true
        winner_team:
          allOf:
          - $ref: '#/components/schemas/Team'
          nullable: true
        winner_colour:
          type: string
          nullable: true
        winner_strategy:
          type: array
          items:
