      - sprints_left
    TitleDriver:
      type: object
      properties:
        driver:
          $ref: '#/components/schemas/Driver'
        points:
          type: number
          format: double
          description: Points that count (after dropped results)
        scored:
          type: number
          format: double
          description: Every point scored, dropped results included
        ceiling:
          type: number
          format: double
          description: Most points the driver can still finish with
        gap:
          type: number
          format: double
          description: Points behind the leader
        status:
          $ref: '#/components/schemas/TitleDriverStatusEnum'
        clinch_margin:
          type: number
          format: double
          nullable: true
          description: 'At the next round the leader is champion if he outscores this
