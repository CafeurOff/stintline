      - height
      - lap_number
      - lap_time_s
      - points
      - width
    TyreCompoundEnum:
      enum:
      - SOFT
      - MEDIUM
      - HARD
      - INTERMEDIATE
      - WET
      type: string
      description: |-
        * `SOFT` - SOFT
        * `MEDIUM` - MEDIUM
        * `HARD` - HARD
        * `INTERMEDIATE` - INTERMEDIATE
        * `WET` - WET
    UndercutAttempt:
      type: object
      properties:
        year:
          type: integer
        event_id:
          type: integer
        session_id:
          type: integer
        wet:
          type: boolean
          description: Intermediate or wet tyres were fitted that race
        attacker:
          allOf:
          - $ref: '#/components/schemas/UndercutCar'
          description: The car that pitted first
        defender:
          allOf:
          - $ref: '#/components/schemas/UndercutCar'
          description: The car directly ahead, which replied
        attacker_lap:
          type: integer
          description: Lap on which the attacker pitted
        defender_lap:
          type: integer
          description: Lap on which the defender pitted
        gap_before_s:
          type: number
          format: double
          description: Attacker behind by this much before
        gap_after_s:
          type: number
          format: double
          description: 'Attacker minus defender after the defender''s out-lap (negative:
            ahead)'
        gain_s:
          type: number
          format: double
          description: gap_before_s - gap_after_s
        success:
          type: boolean
          description: The attacker came out ahead
      required:
      - attacker
      - attacker_lap
      - defender
      - defender_lap
      - event_id
      - gain_s
      - gap_after_s
      - gap_before_s
      - session_id
      - success
      - wet
      - year
    UndercutCar:
      type: object
      properties:
        car_number:
          type: integer
        driver:
          allOf:
          - $ref: '#/components/schemas/Driver'
