        time over one lap.
      properties:
        width:
          type: integer
        height:
          type: integer
        car_number:
          type: integer
          description: Car whose reference lap drew the outline
        lap_number:
          type: integer
        lap_time_s:
          type: number
          format: double
        points:
          type: array
          items:
            type: array
            items:
              type: number
