openapi: 3.0.3
info:
  title: StintLine API
  version: 1.0.0
  description: 'Race strategy analysis for Formula 1 timing data: stints, tyre degradation,
    pit loss, undercut and pit-exit simulation. Unofficial project, not associated
    with Formula 1, the FIA or any team.'
paths:
  /api/v1/drivers:
    get:
      operationId: drivers_list
      description: Every driver since 1950, searchable by name or code, optionally
        limited to a season.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: season
        schema:
          type: integer
      tags:
      - drivers
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDriverListItemList'
          description: ''
  /api/v1/drivers/{ref}:
    get:
      operationId: driver_retrieve
      summary: Driver biography, career totals and season-by-season record
      parameters:
      - in: path
        name: ref
        schema:
          type: string
        required: true
      tags:
      - drivers
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverCareer'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/drivers/{ref}/results:
    get:
      operationId: driver_results_list
      description: Race and sprint results of a driver, most recent first.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: path
        name: ref
        schema:
          type: string
        required: true
      - in: query
        name: season
        schema:
          type: integer
      tags:
      - drivers
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDriverResultList'
          description: ''
  /api/v1/events/{event_id}:
    get:
      operationId: event_retrieve
      summary: A Grand Prix weekend with its sessions and race winner
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - racing
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/health:
    get:
      operationId: health_retrieve
      description: Liveness and readiness of the API and its database.
      summary: API health
      tags:
      - core
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/home:
    get:
      operationId: home_retrieve
      summary: Next Grand Prix, last race podium and championship leaders
      tags:
      - racing
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Home'
          description: ''
  /api/v1/model:
    get:
      operationId: model_retrieve
      summary: Model assumptions and backtest results
      tags:
      - strategy
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCard'
          description: ''
  /api/v1/seasons:
    get:
      operationId: seasons_list
      description: Seasons with stored events, most recent first.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - racing
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSeasonList'
          description: ''
  /api/v1/seasons/{year}/events:
    get:
      operationId: season_events_list
      description: Grands Prix of a season with their sessions (``has_data`` = timing
        ingested).
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - racing
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventList'
          description: ''
  /api/v1/seasons/{year}/standings:
    get:
      operationId: season_standings_retrieve
      summary: 'Drivers'' and constructors'' championships after a round (default:
        latest)'
      parameters:
      - in: query
        name: round
        schema:
          type: integer
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - racing
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Standings'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/seasons/{year}/standings/progression:
    get:
      operationId: season_progression_retrieve
      summary: Championship points of every driver and team after each round
      parameters:
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - racing
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Progression'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/sessions/{session_id}:
    get:
      operationId: session_retrieve
      summary: Session with entries, media and neutralised periods
      parameters:
      - in: path
        name: session_id
        schema:
          type: integer
        required: true
      tags:
      - racing
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
          description: ''
  /api/v1/sessions/{session_id}/compare:
    get:
      operationId: session_compare_retrieve
      summary: Lap-by-lap comparison of two cars
      parameters:
      - in: query
        name: a
        schema:
          type: integer
      - in: query
        name: b
        schema:
          type: integer
      - in: path
        name: session_id
        schema:
          type: integer
        required: true
      tags:
      - strategy
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Compare'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/sessions/{session_id}/degradation:
    get:
      operationId: session_degradation_retrieve
      summary: Tyre degradation per compound and per stint
      parameters:
      - in: query
        name: cars
        schema:
          type: string
      - in: path
        name: session_id
        schema:
          type: integer
        required: true
      tags:
      - strategy
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Degradation'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/sessions/{session_id}/laps:
    get:
      operationId: session_laps_list
      summary: Laps with fuel-corrected times and exclusion reasons
      parameters:
      - in: query
        name: cars
        schema:
          type: string
        description: Comma-separated car numbers, e.g. `1,4`
      - in: path
        name: session_id
        schema:
          type: integer
        required: true
      tags:
      - strategy
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lap'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/sessions/{session_id}/pit-loss:
    get:
      operationId: session_pit_loss_retrieve
      summary: Pit loss measured from the session's stops
      parameters:
      - in: path
        name: session_id
        schema:
          type: integer
        required: true
      tags:
      - strategy
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PitLoss'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/sessions/{session_id}/radio:
    get:
      operationId: session_radio_list
      summary: Team radio messages (references to the official recordings)
      parameters:
      - in: path
        name: session_id
        schema:
          type: integer
        required: true
      tags:
      - racing
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamRadio'
          description: ''
  /api/v1/sessions/{session_id}/replay:
    get:
      operationId: session_replay_retrieve
      summary: Line-crossing times, compounds and tyre ages of every car on every
        lap
      parameters:
      - in: path
        name: session_id
        schema:
          type: integer
        required: true
      tags:
      - strategy
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Replay'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/sessions/{session_id}/sectors:
    get:
      operationId: session_sectors_list
      summary: Best lap, best sectors, ideal lap and top speed of every car
      parameters:
      - in: path
        name: session_id
        schema:
          type: integer
        required: true
      tags:
      - racing
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sectors'
          description: ''
  /api/v1/sessions/{session_id}/simulate/pit-exit:
    post:
      operationId: simulate_pit_exit
      summary: Predict where a car rejoins after pitting on a given lap
      parameters:
      - in: path
        name: session_id
        schema:
          type: integer
        required: true
      tags:
      - strategy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PitExitRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PitExitResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/sessions/{session_id}/simulate/undercut:
    post:
      operationId: simulate_undercut
      summary: 'Simulate an undercut: attacker pits first, defender reacts'
      parameters:
      - in: path
        name: session_id
        schema:
          type: integer
        required: true
      tags:
      - strategy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UndercutRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UndercutResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/sessions/{session_id}/stints:
    get:
      operationId: session_stints_list
      summary: Stints and pit stops of every car, in classification order
      parameters:
      - in: path
        name: session_id
        schema:
          type: integer
        required: true
      tags:
      - racing
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntryStints'
          description: ''
  /api/v1/sessions/{session_id}/track:
    get:
      operationId: session_track_retrieve
      summary: Circuit outline drawn from a reference lap, in screen coordinates
      parameters:
      - in: path
        name: session_id
        schema:
          type: integer
        required: true
      tags:
      - racing
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/teams:
    get:
      operationId: teams_list
      description: Every constructor since 1950, searchable by name, optionally limited
        to a season.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: season
        schema:
          type: integer
      tags:
      - teams
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTeamListList'
          description: ''
  /api/v1/teams/{ref}:
    get:
      operationId: team_retrieve
      summary: 'Constructor record: totals and season-by-season results'
      parameters:
      - in: path
        name: ref
        schema:
          type: string
        required: true
      tags:
      - teams
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamCareer'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
components:
  schemas:
    Assumption:
      type: object
      properties:
        group:
          type: string
        name:
          type: string
        value:
          type: string
        description:
          type: string
      required:
      - description
      - group
      - name
      - value
    CareerTotals:
      type: object
      properties:
        seasons:
          type: integer
        first_season:
          type: integer
          nullable: true
        last_season:
          type: integer
          nullable: true
        starts:
          type: integer
        wins:
          type: integer
        podiums:
          type: integer
        poles:
          type: integer
        fastest_laps:
          type: integer
          nullable: true
          description: Unknown (null) for careers starting before 2004
        points:
          type: number
          format: double
        championships:
          type: integer
        best_finish:
          type: integer
          nullable: true
      required:
      - best_finish
      - championships
      - fastest_laps
      - first_season
      - last_season
      - podiums
      - points
      - poles
      - seasons
      - starts
      - wins
    Circuit:
      type: object
      properties:
        ref:
          type: string
          description: Jolpica circuitId
          maxLength: 64
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 128
        locality:
          type: string
          maxLength: 128
        country:
          type: string
          maxLength: 64
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        wikipedia_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
      required:
      - country
      - locality
      - name
      - ref
    Compare:
      type: object
      properties:
        car_a:
          type: integer
        car_b:
          type: integer
        laps:
          type: array
          items:
            $ref: '#/components/schemas/CompareLap'
        pace_offset_a_s:
          type: number
          format: double
          nullable: true
        pace_offset_b_s:
          type: number
          format: double
          nullable: true
      required:
      - car_a
      - car_b
      - laps
      - pace_offset_a_s
      - pace_offset_b_s
    CompareLap:
      type: object
      properties:
        lap:
          type: integer
        time_a_s:
          type: number
          format: double
          nullable: true
        time_b_s:
          type: number
          format: double
          nullable: true
        gap_s:
          type: number
          format: double
          nullable: true
          description: 'B race time minus A (> 0: A ahead)'
        compound_a:
          type: string
        compound_b:
          type: string
      required:
      - compound_a
      - compound_b
      - gap_s
      - lap
      - time_a_s
      - time_b_s
    ComponentStatusEnum:
      enum:
      - ok
      - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
    CompoundDegradation:
      type: object
      properties:
        compound:
          type: string
        slope_s_per_lap:
          type: number
          format: double
        slope_ci:
          type: array
          items:
            type: number
            format: double
          maxItems: 2
          minItems: 2
        n_laps:
          type: integer
        n_stints:
          type: integer
        new_tyre_pace_s:
          type: number
          format: double
        low_confidence:
          type: boolean
      required:
      - compound
      - low_confidence
      - n_laps
      - n_stints
      - new_tyre_pace_s
      - slope_ci
      - slope_s_per_lap
    CompoundEnum:
      enum:
      - SOFT
      - MEDIUM
      - HARD
      - INTERMEDIATE
      - WET
      - UNKNOWN
      type: string
      description: |-
        * `SOFT` - Soft
        * `MEDIUM` - Medium
        * `HARD` - Hard
        * `INTERMEDIATE` - Intermediate
        * `WET` - Wet
        * `UNKNOWN` - Unknown
    Degradation:
      type: object
      properties:
        compounds:
          type: array
          items:
            $ref: '#/components/schemas/CompoundDegradation'
        stints:
          type: array
          items:
            $ref: '#/components/schemas/StintFit'
        fuel:
          $ref: '#/components/schemas/Fuel'
      required:
      - compounds
      - fuel
      - stints
    DegradationPoint:
      type: object
      properties:
        tyre_age:
          type: integer
        corrected_time_s:
          type: number
          format: double
      required:
      - corrected_time_s
      - tyre_age
    Driver:
      type: object
      properties:
        ref:
          type: string
          description: Jolpica driverId
          maxLength: 64
          pattern: ^[-a-zA-Z0-9_]+$
        code:
          type: string
          maxLength: 3
        given_name:
          type: string
          maxLength: 64
        family_name:
          type: string
          maxLength: 64
        portrait_url:
          type: string
          nullable: true
          readOnly: true
          description: Wikipedia portrait (ADR 0009); official media take precedence
            when present
      required:
      - family_name
      - given_name
      - portrait_url
      - ref
    DriverBio:
      type: object
      properties:
        ref:
          type: string
          description: Jolpica driverId
          maxLength: 64
          pattern: ^[-a-zA-Z0-9_]+$
        code:
          type: string
          maxLength: 3
        given_name:
          type: string
          maxLength: 64
        family_name:
          type: string
          maxLength: 64
        permanent_number:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        nationality:
          type: string
          maxLength: 64
        wikipedia_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        portrait:
          allOf:
          - $ref: '#/components/schemas/Portrait'
          nullable: true
          readOnly: true
      required:
      - family_name
      - given_name
      - portrait
      - ref
    DriverCareer:
      type: object
      properties:
        driver:
          $ref: '#/components/schemas/DriverBio'
        media:
          allOf:
          - $ref: '#/components/schemas/Media'
          nullable: true
        latest_team:
          allOf:
          - $ref: '#/components/schemas/LatestTeam'
          nullable: true
          description: Team of the latest race
        latest_car_number:
          type: integer
          nullable: true
        totals:
          $ref: '#/components/schemas/CareerTotals'
        seasons:
          type: array
          items:
            $ref: '#/components/schemas/SeasonLine'
      required:
      - driver
      - latest_car_number
      - latest_team
      - media
      - seasons
      - totals
    DriverListItem:
      type: object
      properties:
        ref:
          type: string
          description: Jolpica driverId
          maxLength: 64
          pattern: ^[-a-zA-Z0-9_]+$
        code:
          type: string
          maxLength: 3
        given_name:
          type: string
          maxLength: 64
        family_name:
          type: string
          maxLength: 64
        permanent_number:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        nationality:
          type: string
          maxLength: 64
        wikipedia_url:
          oneOf:
