components:
  schemas:
    Assumption:
      type: object
      properties:
        group:
          type: string
        name:
          type: string
        value:
          type: string
        description:
          type: string
      required:
      - description
      - group
      - name
      - value
    BrakingZone:
      type: object
      properties:
        start_m:
          type: integer
        end_m:
          type: integer
        entry_kph:
          type: integer
        min_kph:
          type: integer
          description: 'Lowest speed before full throttle: the apex'
        x:
          type: number
          format: double
        y:
          type: number
          format: double
      required:
      - end_m
      - entry_kph
      - min_kph
      - start_m
      - x
      - y
    CareerTotals:
      type: object
      properties:
        seasons:
          type: integer
        first_season:
          type: integer
          nullable: true
        last_season:
          type: integer
          nullable: true
        starts:
          type: integer
        wins:
          type: integer
        podiums:
          type: integer
        poles:
          type: integer
        fastest_laps:
          type: integer
          nullable: true
          description: Unknown (null) for careers starting before 2004
        points:
          type: number
          format: double
        championships:
          type: integer
        best_finish:
          type: integer
          nullable: true
      required:
      - best_finish
      - championships
      - fastest_laps
      - first_season
      - last_season
      - podiums
      - points
      - poles
      - seasons
      - starts
      - wins
    Championship:
      type: object
      properties:
        round:
          type: integer
        leader:
          $ref: '#/components/schemas/Driver'
        points:
          type: number
          format: double
        second:
          allOf:
          - $ref: '#/components/schemas/Driver'
          nullable: true
        lead:
          type: number
          format: double
          nullable: true
        leader_changed:
          type: boolean
      required:
      - lead
      - leader
      - leader_changed
      - points
      - round
      - second
    Circuit:
      type: object
      properties:
        ref:
          type: string
          description: Jolpica circuitId
          maxLength: 64
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 128
        locality:
          type: string
          maxLength: 128
        country:
          type: string
          maxLength: 64
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        wikipedia_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        outline:
          type: string
          nullable: true
          readOnly: true
          description: Small SVG path of the layout in a 100-unit box, from its newest
            timed race
      required:
      - country
      - locality
      - name
      - outline
      - ref
    CircuitProfile:
      type: object
      properties:
        circuit:
          $ref: '#/components/schemas/Circuit'
        races:
          type: integer
        latest_event_id:
          type: integer
        latest_session_id:
          type: integer
        lap_length_m:
          type: number
          format: double
          nullable: true
        top_speed_kph:
          type: number
          format: double
          nullable: true
        full_throttle_share:
          type: number
          format: double
          nullable: true
        braking_zones:
          type: integer
          nullable: true
        pit_loss_s:
          type: number
          format: double
          nullable: true
          description: Median over the races whose pit loss is reliable
        pit_loss_sigma_s:
          type: number
          format: double
          nullable: true
        degradation_s_per_lap:
          type: number
          format: double
          nullable: true
          description: Median over dry races of the mean dry-compound slope
        degradation:
          $ref: '#/components/schemas/DryCompoundSlopes'
        safety_car_races:
          type: integer
        vsc_races:
          type: integer
        wet_races:
          type: integer
        passes_per_race:
          type: number
          format: double
          nullable: true
        undercut_attempts:
          type: integer
        undercut_successes:
          type: integer
        winning_stops:
          type: array
          items:
            $ref: '#/components/schemas/WinningStops'
        fastest_lap_s:
          type: number
          format: double
          nullable: true
        fastest_lap_year:
          type: integer
          nullable: true
        history:
          type: array
          items:
            $ref: '#/components/schemas/CircuitRace'
      required:
      - braking_zones
      - circuit
      - degradation
      - degradation_s_per_lap
      - fastest_lap_s
      - fastest_lap_year
      - full_throttle_share
      - history
      - lap_length_m
      - latest_event_id
      - latest_session_id
      - passes_per_race
      - pit_loss_s
      - pit_loss_sigma_s
      - races
      - safety_car_races
      - top_speed_kph
      - undercut_attempts
      - undercut_successes
      - vsc_races
      - wet_races
      - winning_stops
    CircuitRace:
      type: object
      properties:
        year:
          type: integer
        event_id:
          type: integer
        session_id:
          type: integer
        name:
          type: string
        winner:
          allOf:
          - $ref: '#/components/schemas/Driver'
          nullable: true
        winner_team:
          allOf:
          - $ref: '#/components/schemas/Team'
          nullable: true
        winner_colour:
          type: string
          nullable: true
        winner_strategy:
          type: array
          items:
            type: string
        wet:
          type: boolean
        passes:
          type: integer
          nullable: true
        safety_cars:
          type: integer
        virtual_safety_cars:
          type: integer
        red_flags:
          type: integer
        pit_loss_s:
          type: number
          format: double
          nullable: true
        pit_loss_reliable:
          type: boolean
        fastest_lap_s:
          type: number
          format: double
          nullable: true
        undercut_attempts:
          type: integer
        undercut_successes:
          type: integer
      required:
      - event_id
      - fastest_lap_s
      - name
      - passes
      - pit_loss_reliable
      - pit_loss_s
      - red_flags
      - safety_cars
      - session_id
      - undercut_attempts
      - undercut_successes
      - virtual_safety_cars
      - wet
      - winner
      - winner_colour
      - winner_strategy
      - winner_team
      - year
    CircuitUndercuts:
      type: object
      properties:
        circuit:
          $ref: '#/components/schemas/Circuit'
        races:
          type: integer
          description: Grands Prix analysed at this circuit
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/UndercutAttempt'
        successes:
          type: integer
        dry_attempts:
          type: integer
        median_gain_s:
          type: number
          format: double
          nullable: true
          description: Median gain over dry races; null below min_attempts
        min_attempts:
          type: integer
          description: Dry attempts needed before the median is given
      required:
      - attempts
      - circuit
      - dry_attempts
      - median_gain_s
      - min_attempts
      - races
      - successes
    Compare:
      type: object
      properties:
        car_a:
          type: integer
        car_b:
          type: integer
        laps:
          type: array
          items:
            $ref: '#/components/schemas/CompareLap'
        pace_offset_a_s:
          type: number
          format: double
          nullable: true
        pace_offset_b_s:
          type: number
          format: double
          nullable: true
      required:
      - car_a
      - car_b
      - laps
      - pace_offset_a_s
      - pace_offset_b_s
    CompareLap:
      type: object
      properties:
        lap:
          type: integer
        time_a_s:
          type: number
          format: double
          nullable: true
        time_b_s:
          type: number
          format: double
          nullable: true
        gap_s:
          type: number
          format: double
          nullable: true
          description: 'B race time minus A (> 0: A ahead)'
        compound_a:
          type: string
        compound_b:
          type: string
      required:
      - compound_a
      - compound_b
      - gap_s
      - lap
      - time_a_s
      - time_b_s
    ComponentStatusEnum:
      enum:
      - ok
      - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
    CompoundDegradation:
      type: object
      properties:
        compound:
          type: string
        slope_s_per_lap:
          type: number
          format: double
        slope_ci:
          type: array
          items:
            type: number
            format: double
          maxItems: 2
          minItems: 2
        n_laps:
          type: integer
        n_stints:
          type: integer
        new_tyre_pace_s:
          type: number
          format: double
        low_confidence:
          type: boolean
      required:
      - compound
      - low_confidence
      - n_laps
      - n_stints
      - new_tyre_pace_s
      - slope_ci
      - slope_s_per_lap
    Consistency:
      type: object
      properties:
        driver:
          $ref: '#/components/schemas/Driver'
        team:
          $ref: '#/components/schemas/Team'
        colour:
          type: string
          nullable: true
        median_spread_s:
          type: number
          format: double
        best:
          $ref: '#/components/schemas/SpreadRace'
        worst:
          $ref: '#/components/schemas/SpreadRace'
        races:
          type: array
          items:
            $ref: '#/components/schemas/ConsistencyRace'
      required:
      - best
      - colour
      - driver
      - median_spread_s
      - races
      - team
      - worst
    ConsistencyRace:
      type: object
      properties:
        round:
          type: integer
        event_id:
          type: integer
        session_id:
          type: integer
        name:
          type: string
        country:
          type: string
        spread_s:
          type: number
          format: double
          nullable: true
        clean_laps:
          type: integer
      required:
      - clean_laps
      - country
      - event_id
      - name
      - round
      - session_id
      - spread_s
    CountBlock:
      type: object
      properties:
        races:
          type: integer
          nullable: true
          description: 'Grands Prix in this part of the season; null: all the rest'
        best:
          type: integer
          nullable: true
          description: 'Results that count among them; null: every one'
      required:
      - best
      - races
    Decision:
      type: object
      properties:
        document_id:
          type: integer
        document_number:
          type: integer
        title:
          type: string
        published_at:
          type: string
