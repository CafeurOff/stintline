      enum:
      - SOFT
      - MEDIUM
      - HARD
      - INTERMEDIATE
      - WET
      type: string
      description: |-
        * `SOFT` - SOFT
        * `MEDIUM` - MEDIUM
        * `HARD` - HARD
        * `INTERMEDIATE` - INTERMEDIATE
        * `WET` - WET
