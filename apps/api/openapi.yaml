      - ceiling
      - clinch_margin
      - driver
      - gap
      - points
      - scored
      - status
    TitleDriverStatusEnum:
      enum:
      - champion
      - leader
      - contender
      - out
      type: string
      description: |-
        * `champion` - champion
        * `leader` - leader
        * `contender` - contender
        * `out` - out
    Track:
      type: object
