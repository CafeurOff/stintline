openapi: 3.0.3
info:
  title: StintLine API
  version: 1.0.0
  description: 'Race strategy analysis for Formula 1 timing data: stints, tyre degradation,
    pit loss, undercut and pit-exit simulation. Unofficial project, not associated
    with Formula 1, the FIA or any team.'
paths:
  /api/v1/analysis/circuits:
    get:
      operationId: analysis_circuits_list
      summary: Track DNA of every circuit raced since 2023, from our own figures
      tags:
      - analysis
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CircuitProfile'
          description: ''
  /api/v1/analysis/circuits/{ref}/undercuts:
    get:
      operationId: analysis_circuit_undercuts_retrieve
      summary: Every green-flag undercut tried at a circuit since 2023, and what it
        gained
      parameters:
      - in: path
        name: ref
        schema:
          type: string
        required: true
      tags:
      - analysis
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CircuitUndercuts'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/analysis/head-to-head:
    get:
      operationId: analysis_head_to_head_retrieve
      summary: 'Two drivers over a season: qualifying, race and fuel-corrected pace
        duels'
      parameters:
      - in: query
        name: a
        schema:
          type: string
        description: Driver ref, e.g. `norris`
      - in: query
        name: b
        schema:
          type: string
        description: Driver ref, e.g. `piastri`
      - in: query
        name: season
        schema:
          type: integer
        description: Season, e.g. `2025`
      tags:
      - analysis
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeadToHead'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/analysis/seasons/{year}/consistency:
    get:
      operationId: analysis_consistency_list
      summary: Drivers ranked by lap-to-lap scatter once tyre wear is removed (2023+)
      parameters:
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - analysis
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Consistency'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/analysis/seasons/{year}/pit-stops:
    get:
      operationId: analysis_pit_stops_retrieve
      summary: Fastest stops, team averages, pit loss and undercuts of a season (2023+)
      parameters:
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - analysis
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PitStops'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/analysis/seasons/{year}/teammates:
    get:
      operationId: analysis_teammates_list
      summary: Every team's teammate duel over a season, best-scoring team first
      parameters:
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - analysis
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Teammates'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/documents:
    get:
      operationId: documents_list
      summary: FIA event documents, newest first or by relevance with a search
      parameters:
      - in: query
        name: car
        schema:
          type: integer
          maximum: 99
          minimum: 1
      - in: query
        name: category
        schema:
          enum:
          - decision
          - infringement
          - summons
          - classification
          - technical
          - notes
          - other
          type: string
          minLength: 1
        description: |-
          * `decision` - Decision
          * `infringement` - Infringement
          * `summons` - Summons
          * `classification` - Classification
          * `technical` - Technical
          * `notes` - Notes
          * `other` - Other
      - in: query
        name: event
        schema:
          type: integer
          minimum: 1
        description: Event id
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 40
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
          maxLength: 120
        description: Full-text search
      - in: query
        name: season
        schema:
          type: integer
          maximum: 2100
          minimum: 1950
      tags:
      - paddock
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPage'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/documents/{document_id}:
    get:
      operationId: document_retrieve
      summary: One FIA document with its text and, for decisions, the stewards' ruling
      parameters:
      - in: path
        name: document_id
        schema:
          type: integer
        required: true
      tags:
      - paddock
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/documents/{document_id}/pdf:
    get:
      operationId: document_pdf_retrieve
      summary: The document's PDF, relayed from fia.com (not stored)
      parameters:
      - in: path
        name: document_id
        schema:
          type: integer
        required: true
      tags:
      - paddock
      security:
      - {}
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Retry after 10 s
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/documents/events:
    get:
      operationId: documents_events_list
      summary: Grands Prix of a season with documents, latest first, with counts
      parameters:
      - in: query
        name: season
        schema:
          type: integer
          maximum: 2100
          minimum: 1950
        required: true
      tags:
      - paddock
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventDocuments'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/drivers:
    get:
      operationId: drivers_list
      description: Every driver since 1950, searchable by name or code, optionally
        limited to a season.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: season
        schema:
          type: integer
      tags:
      - drivers
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDriverListItemList'
          description: ''
  /api/v1/drivers/{ref}:
    get:
      operationId: driver_retrieve
      summary: Driver biography, career totals and season-by-season record
      parameters:
      - in: path
        name: ref
        schema:
          type: string
        required: true
      tags:
      - drivers
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverCareer'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/drivers/{ref}/form:
    get:
      operationId: driver_form_retrieve
      summary: 'Last five Grands Prix: finish, grid and fuel-corrected pace gap to
        the teammate'
      parameters:
      - in: path
        name: ref
        schema:
          type: string
        required: true
      tags:
      - drivers
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverForm'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/drivers/{ref}/portrait:
    get:
      operationId: driver_portrait_retrieve
      summary: The driver's Wikipedia portrait, relayed from Wikimedia (ADR 0024,
        not stored)
      parameters:
      - in: path
        name: ref
        schema:
          type: string
        required: true
      tags:
      - drivers
      security:
      - {}
      responses:
        '200':
          content:
            image/*:
              schema:
                type: string
                format: binary
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/drivers/{ref}/results:
    get:
      operationId: driver_results_list
      description: Race and sprint results of a driver, most recent first.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: path
        name: ref
        schema:
          type: string
        required: true
      - in: query
        name: season
        schema:
          type: integer
      tags:
      - drivers
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDriverResultList'
          description: ''
  /api/v1/events/{event_id}:
    get:
      operationId: event_retrieve
      summary: A Grand Prix weekend with its sessions and race winner
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - racing
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/forecasts:
    get:
      operationId: forecasts_list
      summary: Weather forecasts of upcoming sessions (Open-Meteo, CC BY 4.0)
      parameters:
      - in: query
        name: event
        schema:
          type: integer
        description: Only this Grand Prix
      tags:
      - forecasts
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionForecast'
          description: ''
  /api/v1/health:
    get:
      operationId: health_retrieve
      description: Liveness and readiness of the API and its database.
      summary: API health
      tags:
      - core
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/home:
    get:
      operationId: home_retrieve
      summary: Next Grand Prix, last race podium and championship leaders
      tags:
      - racing
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Home'
          description: ''
  /api/v1/live:
    get:
      operationId: live_retrieve
      summary: Live session snapshot (local live mode) and the next session
      tags:
      - live
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveStatus'
          description: ''
  /api/v1/model:
    get:
      operationId: model_retrieve
      summary: Model assumptions and backtest results
      tags:
      - strategy
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCard'
          description: ''
  /api/v1/news/headlines:
    get:
      operationId: news_headlines_list
      summary: Latest headlines from public news feeds (title and link only)
      parameters:
      - in: query
        name: lang
        schema:
          enum:
          - en
          - fr
          type: string
          minLength: 1
        description: |-
          * `en` - en
          * `fr` - fr
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 60
          minimum: 1
          default: 30
      tags:
      - news
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Headline'
          description: ''
  /api/v1/news/reports:
    get:
      operationId: news_reports_list
      summary: Reports of the latest races and sprints, written from our data
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 30
          minimum: 1
          default: 12
      tags:
      - news
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RaceReport'
          description: ''
  /api/v1/news/reports/{session_id}:
    get:
      operationId: news_report_retrieve
      summary: Report of one race or sprint
      parameters:
      - in: path
        name: session_id
        schema:
          type: integer
        required: true
      tags:
      - news
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RaceReport'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/seasons:
    get:
      operationId: seasons_list
      description: Seasons with stored events, most recent first.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - racing
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSeasonList'
          description: ''
  /api/v1/seasons/{year}/events:
    get:
      operationId: season_events_list
      description: Grands Prix of a season with their sessions (``has_data`` = timing
        ingested).
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - racing
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventList'
          description: ''
  /api/v1/seasons/{year}/standings:
    get:
      operationId: season_standings_retrieve
      summary: 'Drivers'' and constructors'' championships after a round (default:
        latest)'
      parameters:
      - in: query
        name: round
        schema:
          type: integer
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - racing
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Standings'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/seasons/{year}/standings/progression:
    get:
      operationId: season_progression_retrieve
      summary: Championship points of every driver and team after each round
      parameters:
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - racing
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Progression'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/seasons/{year}/title:
    get:
      operationId: season_title_retrieve
      summary: 'Title maths: who can still be champion, what the leader needs, when
        it was decided'
      parameters:
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - racing
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Title'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/sessions/{session_id}:
    get:
      operationId: session_retrieve
      summary: Session with entries, media and neutralised periods
      parameters:
      - in: path
        name: session_id
        schema:
          type: integer
        required: true
      tags:
      - racing
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
          description: ''
  /api/v1/sessions/{session_id}/compare:
    get:
      operationId: session_compare_retrieve
      summary: Lap-by-lap comparison of two cars
      parameters:
      - in: query
        name: a
        schema:
          type: integer
      - in: query
        name: b
        schema:
          type: integer
      - in: path
        name: session_id
        schema:
          type: integer
        required: true
      tags:
      - strategy
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Compare'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/sessions/{session_id}/degradation:
    get:
      operationId: session_degradation_retrieve
      summary: Tyre degradation per compound and per stint
      parameters:
      - in: query
        name: cars
        schema:
          type: string
      - in: path
        name: session_id
        schema:
          type: integer
        required: true
      tags:
      - strategy
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Degradation'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/sessions/{session_id}/laps:
    get:
      operationId: session_laps_list
      summary: Laps with fuel-corrected times and exclusion reasons
      parameters:
      - in: query
        name: cars
        schema:
          type: string
        description: Comma-separated car numbers, e.g. `1,4`
      - in: path
        name: session_id
        schema:
          type: integer
        required: true
      tags:
      - strategy
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lap'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/sessions/{session_id}/pace:
    get:
      operationId: session_pace_retrieve
      summary: 'Race pace of every car: box plots, laps and fastest laps, with filters'
      parameters:
      - in: query
        name: cutoff
        schema:
          type: integer
        description: '% of the fastest lap, 0 keeps all'
      - in: query
        name: fuel
        schema:
          type: boolean
        description: Fuel-corrected times (default true)
      - in: query
        name: pit
        schema:
          type: boolean
        description: Keep in-laps and out-laps
      - in: query
        name: sc
        schema:
          type: boolean
        description: Keep neutralised and restart laps
      - in: path
        name: session_id
        schema:
          type: integer
        required: true
      tags:
      - analysis
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPace'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/sessions/{session_id}/pit-loss:
    get:
      operationId: session_pit_loss_retrieve
