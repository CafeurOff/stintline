        wet:
          type: boolean
        passes:
          type: integer
          nullable: true
        safety_cars:
          type: integer
        virtual_safety_cars:
          type: integer
        red_flags:
          type: integer
        pit_loss_s:
          type: number
          format: double
          nullable: true
        pit_loss_reliable:
          type: boolean
        fastest_lap_s:
          type: number
          format: double
          nullable: true
        undercut_attempts:
          type: integer
        undercut_successes:
          type: integer
      required:
