      type: object
      properties:
        gap_before_s:
          type: number
          format: double
        gap_after_s:
          type: number
          format: double
        net_gain_s:
          type: number
          format: double
        sigma_s:
          type: number
          format: double
        p_attacker_ahead:
          type: number
          format: double
        attacker_ahead:
          type: boolean
        lap_gaps:
          type: array
          items:
            $ref: '#/components/schemas/LapGap'
      required:
      - attacker_ahead
      - gap_after_s
      - gap_before_s
      - lap_gaps
      - net_gain_s
      - p_attacker_ahead
      - sigma_s
