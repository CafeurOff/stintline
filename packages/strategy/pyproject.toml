[project]
name = "stintline-strategy"
version = "0.1.0"
description = "Pure Python race strategy engine: lap cleaning, degradation, pit loss, undercut and pit-exit simulation"
requires-python = ">=3.13"
license = "MIT"
dependencies = []

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
addopts = [
    "--strict-markers",
    "--disable-socket",
    "--cov=stintline_strategy",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=90",
]

[tool.coverage.run]
branch = true
