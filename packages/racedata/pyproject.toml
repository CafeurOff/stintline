[project]
name = "stintline-racedata"
version = "0.1.0"
description = "Typed adapters for public motorsport timing data (OpenF1, Jolpica, live timing) with rate limiting, retries and caching"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
]

[dependency-groups]
dev = ["respx>=0.22"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "racedata"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
addopts = [
    "--strict-markers",
    "--disable-socket",
    "--cov=racedata",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=85",
]

[tool.coverage.run]
branch = true
