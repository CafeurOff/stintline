# Serves the built SPA's files and proxies the API, WebSockets and pages to the ASGI service.
# Pages (any path that is not a file) are rendered by the API with their own head: title,
# description, canonical, languages, previews and a real 404 (ADR 0025).

# Behind a TLS proxy, keep the scheme it reports; otherwise use ours. Django redirects
# plain HTTP to HTTPS in production, so overwriting it would loop.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    include /etc/nginx/snippets/security-headers.conf;
    # The page's Content-Security-Policy comes from the API, which knows its inline scripts.

    # Text compresses 3-5x; images and fonts are compressed already.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json
               application/problem+json application/xml image/svg+xml text/plain;

    location /api/ {
        proxy_pass http://api:8000;
        # Ours (security-headers.conf) replace Django's copies, so each is sent once.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri @page;
    }

    location @page {
        proxy_pass http://api:8000;
        # Ours (security-headers.conf) replace Django's copies, so each is sent once.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Cross-Origin-Opener-Policy;
        # With the port: canonical and sitemap addresses are built from it (unless SITE_URL).
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
