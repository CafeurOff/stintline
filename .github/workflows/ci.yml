name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  PYTHON_VERSION: "3.13"

jobs:
  python:
    name: Python · lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stintline
          POSTGRES_USER: stintline
          POSTGRES_PASSWORD: stintline-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stintline" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-packages
      - name: Ruff
        run: |
          uv run ruff check . --output-format=github
          uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy
      - name: Strategy engine tests (coverage >= 90 %)
        run: uv run pytest packages/strategy --cov-report=xml:coverage-strategy.xml
      - name: Provider library tests (coverage >= 85 %)
        run: uv run pytest packages/racedata --cov-report=xml:coverage-racedata.xml
      - name: API tests on Postgres (coverage >= 80 %)
        env:
          DATABASE_URL: postgres://stintline:stintline-ci@localhost:5432/stintline
        run: uv run pytest apps/api --cov-report=xml:coverage-api.xml
      - name: Migrations are up to date
        run: uv run python apps/api/manage.py makemigrations --check --dry-run --settings config.settings.test
      - name: OpenAPI schema is up to date
        run: |
          uv run python apps/api/manage.py spectacular --settings config.settings.test \
            --validate --fail-on-warn --file /tmp/openapi.yaml
          diff -u apps/api/openapi.yaml /tmp/openapi.yaml
      - uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: coverage-*.xml

  web:
    name: Web · lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated API types match the OpenAPI schema
        run: pnpm --filter @stintline/api-types check
      - run: pnpm -r lint
      - run: pnpm -r format:check
      - run: pnpm -r typecheck
      - name: Unit tests (coverage >= 80 %)
        run: pnpm --filter web test
      - run: pnpm --filter web build

  e2e:
    name: Web · Playwright
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report

  docker:
    name: Docker · production images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f infra/docker/api.Dockerfile --target prod -t stintline-api:ci .
      - run: docker build -f infra/docker/web.Dockerfile --target prod -t stintline-web:ci .

  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
